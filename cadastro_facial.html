<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Facial - Equipe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            padding: 10px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 15px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input { background-color: #333; color: white; border: 1px solid #555; }
        button {
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:disabled {
            background-color: #444 !important;
            color: #888;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        #btn-iniciar { background-color: #007bff; }
        .btn-frente { background-color: #28a745; }
        .btn-perfil { background-color: #17a2b8; }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none;
        }
        video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }
        
        .oval-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 280px;
            border: 4px dashed #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.65);
            pointer-events: none;
            z-index: 10;
            transition: border-color 0.3s;
        }
        .oval-guide.sucesso { border-color: #28a745; border-style: solid; }
        
        #controles { display: none; margin-top: 15px; }
        #mensagem-fim { display: none; margin-top: 15px; color: #28a745; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Biometria Facial</h2>
        <p style="font-size: 14px; color: #aaa;">Preencha os dados e siga a sequência obrigatória de captura.</p>
        
        <input type="text" id="login" placeholder="Login (Ex: 1234)">
        <input type="text" id="nome" placeholder="Nome (Ex: Joao Silva)">
        
        <button id="btn-iniciar" onclick="iniciarCamera()">1. Ativar Câmera</button>
        
        <div class="video-wrapper" id="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <div class="oval-guide" id="oval-guide"></div>
        </div>
        
        <canvas id="canvas" style="display:none;"></canvas>

        <div id="controles">
            <!-- Apenas o primeiro botão começa liberado -->
            <button id="btn-frente" class="btn-frente" onclick="capturaFrente()">📸 1. Capturar Frente</button>
            <button id="btn-dir" class="btn-perfil" onclick="capturaTimer('Dir', 'btn-dir', 'btn-esq')" disabled>⏱️ 2. Perfil Direito</button>
            <button id="btn-esq" class="btn-perfil" onclick="capturaTimer('Esq', 'btn-esq', null)" disabled>⏱️ 3. Perfil Esquerdo</button>
        </div>
        
        <div id="mensagem-fim">✅ Cadastro 100% Concluído!</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const controles = document.getElementById('controles');
        const wrapper = document.getElementById('video-wrapper');
        const btnIniciar = document.getElementById('btn-iniciar');
        const oval = document.getElementById('oval-guide');
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function tocarBip(frequencia, duracao, volume = 1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duracao);
        }

        async function iniciarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
                wrapper.style.display = "block";
                controles.style.display = "block";
                btnIniciar.style.display = "none";
            } catch (erro) {
                alert("Erro ao acessar câmera. Libere a permissão no navegador.");
            }
        }

        function validarCampos() {
            const login = document.getElementById('login').value.trim();
            const nome = document.getElementById('nome').value.trim();
            if (!login || !nome) {
                alert("Por favor, preencha o Login e o Nome antes de capturar a foto.");
                return false;
            }
            return { login, nome: nome.replace(/ /g, '_') };
        }

        function executarCaptura(dados, angulo) {
            oval.classList.add('sucesso');
            setTimeout(() => oval.classList.remove('sucesso'), 500);

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.download = `${dados.login}_${dados.nome}_${angulo}.jpg`;
            link.click();
        }

        function atualizarEsteira(botaoAtual, botaoProximo) {
            const btnAtual = document.getElementById(botaoAtual);
            btnAtual.disabled = true;
            btnAtual.innerText = "✅ Concluído";

            if (botaoProximo) {
                document.getElementById(botaoProximo).disabled = false;
            } else {
                // Fim da esteira
                document.getElementById('mensagem-fim').style.display = "block";
                oval.style.borderColor = "#28a745"; // Trava o oval verde
                oval.style.borderStyle = "solid";
            }
        }

        function capturaFrente() {
            const dados = validarCampos();
            if (!dados) return;

            tocarBip(800, 0.1);
            executarCaptura(dados, 'Frente');
            atualizarEsteira('btn-frente', 'btn-dir');
        }

        function capturaTimer(angulo, btnAtualId, btnProximoId) {
            const dados = validarCampos();
            if (!dados) return;

            const btnAtual = document.getElementById(btnAtualId);
            btnAtual.disabled = true; // Trava o botão para evitar clique duplo
            btnAtual.innerText = "⏱️ Aguarde...";

            let contagem = 3;
            tocarBip(600, 0.2); 
            
            const intervalo = setInterval(() => {
                contagem--;
                if (contagem > 0) {
                    tocarBip(600, 0.1);
                } else {
                    clearInterval(intervalo);
                    tocarBip(1000, 0.4);
                    executarCaptura(dados, angulo);
                    atualizarEsteira(btnAtualId, btnProximoId);
                }
            }, 1000);
        }
    </script>
</body>
</html>
